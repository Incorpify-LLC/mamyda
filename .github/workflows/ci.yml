name: CI
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mamyda
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mamyda_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mamyda -d mamyda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mamyda:ci-only-password@127.0.0.1:5432/mamyda_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-any-deployed-environment
      VITE_AUTH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Apply migrations and check rerun safety
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - name: Start development server
        run: |
          sh startup.sh
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e
      - name: Development desktop and mobile smoke
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8080/ screenshots/audit-dev.png
      - run: npm run build
      - name: Start built application
        env:
          BETTER_AUTH_URL: http://127.0.0.1:8081
        run: npm run preview:restart
      - name: Built desktop and mobile smoke
        run: node scripts/browser-smoke.mjs http://127.0.0.1:8081/ screenshots/audit-built.png --baseline screenshots/audit-dev.json
      - name: Exercise built application
        env:
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            screenshots/audit-*
            screenshots/e2e-*
          retention-days: 7
